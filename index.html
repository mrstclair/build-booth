<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Build Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1A33; --navy-2:#16264A; --navy-3:#22365F; --line:#2E4677;
  --orange:#F7931E; --orange-2:#FFB347; --orange-dk:#B8620A;
  --ink:#FFFFFF; --muted:#A9BBDD; --green:#22B573; --green-dk:#167A4D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1B2D57 0%,var(--navy) 60%);color:var(--ink);
  font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
button:disabled{cursor:default}

/* minmax(0,1fr) stops the long border row from stretching the page wider than the screen */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:12px 18px 16px;overflow:hidden}
.app > *{min-width:0}

/* header */
header{display:flex;align-items:center;gap:16px;min-height:56px;min-width:0}
.logo{flex-shrink:0}
.classPill{min-width:0}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:28px;line-height:1}
.logo .paw{width:48px;height:48px;border-radius:14px;background:var(--orange);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 var(--orange-dk)}
.logo small{display:block;font-size:13px;font-weight:600;color:var(--orange-2);letter-spacing:3px;margin-top:4px}
.spacer{flex:1}
.pending{background:#3B2A0B;color:var(--orange-2);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:600}
.classPill{display:flex;align-items:center;gap:12px;background:var(--navy-2);border:2px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;font-size:20px}
.classPill .who{font-weight:700;color:var(--orange-2);max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.classPill .who.none{color:var(--muted);font-weight:500}
.pillBtn{background:var(--navy-3);border-radius:999px;padding:9px 16px;font-size:16px;font-weight:600}
.clock{font-size:22px;font-weight:600;color:var(--muted);min-width:110px;text-align:right;font-variant-numeric:tabular-nums}

/* stage */
main{display:flex;align-items:center;justify-content:center;min-height:0}
.stage{position:relative;width:min(100%,calc((100vh - 250px) * 16 / 9));width:min(100%,calc((100dvh - 250px) * 16 / 9));max-height:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.stage video,.stage canvas,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#video.mirror{transform:scaleX(-1)}
.flipBtn{background:var(--navy-2);border:2px solid var(--line);border-radius:999px;padding:9px 16px;font-size:18px;font-weight:600;white-space:nowrap}
.flipBtn:disabled{opacity:.5}
.count{position:absolute;inset:0;display:none;place-items:center;font-size:min(42vh,40vw);font-weight:700;color:#fff;
  text-shadow:0 8px 0 rgba(0,0,0,.35),0 0 40px rgba(247,147,30,.9);pointer-events:none}
.count.show{display:grid}
.count span{animation:pop .95s ease-out both}
@keyframes pop{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}85%{opacity:1}100%{transform:scale(.85);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

.review{position:absolute;inset:0;display:none;background:#000}
.review.show{display:block}
.reviewBar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:18px;justify-content:center;padding:22px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.autoNote{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.6);padding:8px 16px;border-radius:999px;font-size:18px;font-weight:600}
.big{height:84px;padding:0 34px;border-radius:22px;font-size:28px;font-weight:700;display:flex;align-items:center;gap:12px;transition:transform .08s}
.big:active{transform:translateY(4px)}
.big.save{background:var(--green);box-shadow:0 6px 0 var(--green-dk)}
.big.retake{background:#3A4E7A;box-shadow:0 6px 0 #26365A}
.big:disabled{opacity:.6}

/* footer */
footer{display:flex;align-items:center;gap:18px;transition:opacity .2s}
footer.locked{opacity:.3;pointer-events:none}
.borders{flex:1;min-width:0;display:flex;gap:12px;overflow-x:auto;padding:8px 4px 10px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--navy-2);border:3px solid transparent;border-radius:16px;padding:8px;width:152px;transition:transform .12s,border-color .12s}
.chip canvas{width:132px;height:74px;border-radius:8px;display:block}
.chip span{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:132px}
.chip.on{border-color:var(--orange);background:var(--navy-3);transform:translateY(-4px)}
.snap{flex:0 0 auto;height:128px;min-width:250px;border-radius:28px;background:var(--orange);font-size:34px;font-weight:700;
  box-shadow:0 8px 0 var(--orange-dk);display:flex;align-items:center;justify-content:center;gap:14px;padding:0 30px;transition:transform .08s}
.snap:active{transform:translateY(6px);box-shadow:0 2px 0 var(--orange-dk)}
.snap .cam{font-size:50px}

/* class picker */
.modal{position:fixed;inset:0;background:rgba(5,10,25,.82);display:none;place-items:center;z-index:20}
.modal.show{display:grid}
.sheet{background:var(--navy-2);border:2px solid var(--line);border-radius:24px;padding:26px;width:min(920px,92vw);max-height:86vh;overflow:auto}
.sheet h2{font-size:34px}
.sheet p{color:var(--muted);margin:4px 0 18px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tbtn{background:var(--navy-3);border-radius:16px;padding:16px 18px;text-align:left;font-size:23px;font-weight:600;border:2px solid transparent}
.tbtn:active{border-color:var(--orange)}
.tbtn small{display:block;color:var(--orange-2);font-size:17px;font-weight:500;margin-top:2px}
.tbtn.other{border:2px dashed var(--line);background:transparent}
.closeRow{display:flex;justify-content:flex-end;margin-top:18px}

/* photo gallery */
.gallery{position:fixed;inset:0;background:var(--navy);z-index:22;display:none;flex-direction:column}
.gallery.show{display:flex}
.gHead{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.gHead h2{font-size:28px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.gBtn{background:var(--navy-3);border-radius:999px;padding:10px 18px;font-size:18px;font-weight:600}
.gClose{width:48px;height:48px;padding:0;font-size:20px}
.gTabs{display:flex;background:var(--navy-2);border:2px solid var(--line);border-radius:999px;padding:4px}
.gTab{background:transparent;border-radius:999px;padding:9px 16px;font-size:17px;font-weight:600;color:var(--muted)}
.gTab.on{background:var(--orange);color:#fff}
.gBody{flex:1;overflow-y:auto;padding:18px;-webkit-overflow-scrolling:touch}
.gEmpty{display:grid;place-items:center;text-align:center;min-height:50vh;color:var(--muted);font-size:22px;line-height:1.5}
.gEmpty b{display:block;font-size:56px;margin-bottom:8px}
.gGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gBigGrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.gBigGrid .gThumb .cap{font-size:16px;padding:6px 10px}
@media (max-width:700px){.gBigGrid{grid-template-columns:1fr}}
.gDate{font-size:20px;font-weight:700;color:var(--orange-2);margin:18px 2px 10px}
.gDate:first-child{margin-top:0}
.gThumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--navy-2);border:2px solid transparent;padding:0}
.gThumb:active,.gThumb:focus-visible{border-color:var(--orange)}
.gThumb img{width:100%;height:100%;object-fit:cover;display:block}
.gThumb .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:13px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left}
.gThumb .spin{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.gThumb.err .spin{font-size:26px}
.gClassGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gClass{background:var(--navy-2);border:2px solid var(--line);border-radius:18px;padding:0;overflow:hidden;text-align:left}
.gClass:active{border-color:var(--orange)}
.gClass .cover{aspect-ratio:16/9;background:var(--navy-3);display:grid;place-items:center;font-size:40px;overflow:hidden}
.gClass .cover img{width:100%;height:100%;object-fit:cover;display:block}
.gClass .meta{padding:10px 14px 12px}
.gClass .meta b{display:block;font-size:22px}
.gClass .meta span{color:var(--muted);font-size:15px}
.gMore{display:block;margin:20px auto 6px}
.gNote{color:var(--muted);font-size:16px;margin-bottom:12px}
/* PIN pad */
.pinBox{max-width:340px;margin:4vh auto 0;text-align:center}
.pinBox h3{font-size:26px;margin-bottom:6px}
.pinBox p{color:var(--muted);font-size:17px;margin-bottom:16px}
.pinDots{display:flex;justify-content:center;gap:14px;margin-bottom:18px;min-height:26px}
.pinDots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--orange-2)}
.pinDots i.f{background:var(--orange-2)}
.pinDots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pinPad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pinPad button{height:72px;border-radius:18px;background:var(--navy-3);font-size:30px;font-weight:700}
.pinPad button:active{background:var(--orange)}
.pinPad .ok{background:var(--green)}
.pinMsg{color:#FF8A8A;font-size:18px;min-height:26px;margin-top:12px}
/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(3,7,18,.96);z-index:24;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lightbox.show{display:flex}
.lbStage{display:flex;align-items:center;gap:12px;width:100%;justify-content:center;min-height:0;flex:1}
.lbImgWrap{position:relative;flex:1;max-width:min(1280px,100%);display:flex;align-items:center;justify-content:center;min-height:0;height:100%}
.lbImgWrap img{max-width:100%;max-height:calc(100dvh - 190px);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.lbLoading{position:absolute;inset:0;display:none;place-items:center;font-size:22px;color:var(--muted)}
.lbLoading.show{display:grid}
.lbNav{width:58px;height:58px;border-radius:50%;background:var(--navy-3);font-size:34px;font-weight:700;flex:0 0 auto}
.lbNav:disabled{opacity:.25}
.lbInfo{font-size:18px;color:var(--muted);text-align:center}
.lbActions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.lbActions .big{height:60px;font-size:20px;padding:0 22px;text-decoration:none;color:#fff}
@media (max-width:700px){
  .gHead h2{font-size:22px;max-width:60vw}
  .gTabs{order:5;width:100%}
  .gTab{flex:1}
  .gGrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .gClassGrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .lbNav{width:44px;height:44px;font-size:26px}
  .lbActions .big{height:52px;font-size:17px;padding:0 14px}
}

/* select + send */
.gThumb .check{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.35);display:none;place-items:center;font-size:20px;font-weight:700;color:#fff}
.selecting .gThumb .check{display:grid}
.selecting .gThumb.sel{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange)}
.selecting .gThumb.sel .check{background:var(--orange);border-color:var(--orange)}
.selecting .gThumb.sel img{opacity:.85}
#gSelect.on{background:var(--orange)}
.selBar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:2px solid var(--line);background:var(--navy-2);flex-wrap:wrap}
.selBar[hidden]{display:none}
.selCount{font-size:20px;font-weight:700;margin-right:auto}
.selSend{height:58px;font-size:22px;padding:0 26px}
.sendDlg{position:fixed;inset:0;background:rgba(3,7,18,.85);z-index:26;display:none;place-items:center;padding:16px}
.sendDlg.show{display:grid}
.sendCard{background:var(--navy-2);border:2px solid var(--line);border-radius:22px;padding:22px;width:min(720px,100%);max-height:calc(100dvh - 32px);overflow-y:auto}
.sendCard h2{font-size:28px;margin-bottom:10px}
.sendStrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.sendStrip img{height:64px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--navy-3)}
.sendStrip .more{height:64px;padding:0 14px;display:grid;place-items:center;background:var(--navy-3);border-radius:8px;color:var(--muted);font-weight:700;flex:0 0 auto}
.sendLabel{font-size:15px;font-weight:700;color:var(--orange-2);letter-spacing:1px;text-transform:uppercase;margin:12px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{background:var(--navy-3);border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-size:17px;font-weight:600;text-align:left}
.chip2 small{color:var(--muted);font-weight:500;margin-left:6px}
.chip2.on{background:var(--orange);border-color:var(--orange)}
.chip2.on small{color:#fff}
.chip2.on::before{content:'✓ '}
.addRow{display:flex;gap:8px;margin-top:10px}
.addRow input{flex:1;min-width:0;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--navy);color:#fff;font:inherit;font-size:17px;padding:0 14px}
.sendHint{color:var(--muted);font-size:14px;margin-top:6px;min-height:18px}
#sendMsg{width:100%;border-radius:12px;border:2px solid var(--line);background:var(--navy);color:#fff;font:inherit;font-size:18px;padding:12px 14px;resize:vertical}
.sendErr{color:#FF8A8A;font-size:17px;min-height:24px;margin-top:8px}
.sendActions{display:flex;justify-content:flex-end;gap:12px;margin-top:6px;flex-wrap:wrap}
.sendActions .big{height:60px;font-size:22px}
@media (max-width:700px){
  .selCount{font-size:17px;flex-basis:100%}
  .selBar .gBtn{font-size:15px;padding:8px 12px}
  .selSend{flex:1}
  .sendCard{padding:16px}
  .sendCard h2{font-size:22px}
  .sendActions .big{flex:1;justify-content:center;white-space:nowrap;font-size:20px;padding:0 12px}
}

/* toast + blocker */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:var(--navy-2);border:4px solid var(--orange);
  border-radius:30px;padding:30px 46px;font-size:40px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:.2s;max-width:80vw;
  box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:25}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast small{display:block;font-size:22px;color:var(--muted);font-weight:500;margin-top:8px}
.blocker{position:fixed;inset:0;background:var(--navy);display:none;place-items:center;text-align:center;padding:30px;z-index:30}
.blocker.show{display:grid}
.blocker h1{font-size:42px}
.blocker p{font-size:20px;color:var(--muted);max-width:680px;margin:14px auto 24px;line-height:1.4;user-select:text}
.blocker .big{margin:0 auto}

/* Narrow screens (phones upright, small windows): Snap button gets its own full-width row */
@media (max-width:900px){
  .clock{display:none}
  .logo{font-size:22px}
  .logo .paw{width:40px;height:40px;font-size:24px}
  .logo small{display:none}
  .classPill{font-size:16px;padding:4px 4px 4px 12px}
  .flipBtn{font-size:15px;padding:8px 12px}
  footer{flex-wrap:wrap;gap:10px}
  .borders{flex-basis:100%}
  .snap{width:100%;height:84px;min-width:0;font-size:30px}
  .stage{width:min(100%,calc((100vh - 330px) * 16 / 9));width:min(100%,calc((100dvh - 330px) * 16 / 9))}
}
@media (max-width:560px){
  header{flex-wrap:wrap;gap:8px}
  .spacer{display:none}
  .classPill{order:3;flex:1 1 100%;justify-content:space-between}
  .stage{width:100%}
}

/* Short screens (phones sideways, big displays at high zoom): one compact row at the bottom */
@media (max-height:620px){
  .app{gap:8px;padding:8px 12px 10px}
  header{min-height:44px}
  .logo{font-size:20px}
  .logo .paw{width:36px;height:36px;font-size:22px;box-shadow:0 3px 0 var(--orange-dk)}
  .logo small{display:none}
  .classPill{font-size:15px;padding:3px 3px 3px 12px}
  .pillBtn,.flipBtn{font-size:14px;padding:6px 10px}
  footer{flex-wrap:nowrap;gap:10px}
  .borders{flex-basis:auto;padding:4px 2px 6px;gap:8px}
  .chip{width:112px;padding:5px;gap:3px}
  .chip canvas{width:98px;height:55px}
  .chip span{font-size:12px;max-width:98px}
  .snap{width:auto;height:76px;min-width:150px;font-size:24px;padding:0 18px;border-radius:20px}
  .snap .cam{font-size:32px}
  .stage{width:min(100%,calc((100vh - 160px) * 16 / 9));width:min(100%,calc((100dvh - 160px) * 16 / 9));border-radius:14px}
  .big{height:60px;font-size:20px;padding:0 20px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" id="logo"><div class="paw">🐯</div><div>Build Booth<small>TIGER LAB</small></div></div>
    <div class="spacer"></div>
    <div class="pending" id="pending" hidden></div>
    <button class="flipBtn" id="galleryBtn">🖼️ Photos</button>
    <button class="flipBtn" id="flipBtn" hidden>🔄 Flip camera</button>
    <div class="classPill"><span>📁</span><span class="who none" id="who">Loading…</span><button class="pillBtn" id="changeBtn">Change</button></div>
    <div class="clock" id="clock"></div>
  </header>

  <main>
    <div class="stage" id="stage">
      <video id="video" class="mirror" autoplay playsinline muted></video>
      <canvas id="overlay" width="1280" height="720"></canvas>
      <div class="count" id="count"></div>
      <div class="flash" id="flash"></div>
      <div class="review" id="review">
        <img id="reviewImg" alt="Your creation photo">
        <div class="autoNote" id="autoNote"></div>
        <div class="reviewBar">
          <button class="big retake" id="retakeBtn">🔄 Try again</button>
          <button class="big save" id="saveBtn">✅ Save it!</button>
        </div>
      </div>
    </div>
  </main>

  <footer id="controls">
    <div class="borders" id="borders"></div>
    <button class="snap" id="snapBtn"><span class="cam">📸</span>Snap it!</button>
  </footer>
</div>

<div class="modal" id="picker">
  <div class="sheet">
    <h2>Whose class are you in?</h2>
    <p>Tap your teacher's name.</p>
    <div class="grid" id="pickGrid"></div>
    <div class="closeRow"><button class="big retake" id="pickClose">✖ Cancel</button></div>
  </div>
</div>

<!-- Photo gallery -->
<div class="gallery" id="gallery" aria-hidden="true">
  <div class="gHead">
    <button class="gBtn" id="gBack" hidden>‹ Back</button>
    <h2 id="gTitle">Photos</h2>
    <button class="gBtn" id="gSelect" hidden>☑️ Select to send</button>
    <div class="gTabs">
      <button class="gTab on" data-tab="recent">📸 Just taken</button>
      <button class="gTab" data-tab="classes">🔒 Class photos</button>
    </div>
    <button class="gBtn gClose" id="gClose" aria-label="Close photos">✖</button>
  </div>
  <div class="gBody" id="gBody"></div>
  <div class="selBar" id="selBar" hidden>
    <span class="selCount" id="selCount">0 selected</span>
    <button class="gBtn" id="selToday">Select today's</button>
    <button class="gBtn" id="selClear">Clear</button>
    <button class="big save selSend" id="selSend" disabled>✉️ Send</button>
  </div>
</div>

<!-- Send photos dialog -->
<div class="sendDlg" id="sendDlg" aria-hidden="true">
  <div class="sendCard">
    <h2 id="sendTitle">Send photos</h2>
    <div class="sendStrip" id="sendStrip"></div>
    <div class="sendLabel">Send to</div>
    <div class="chips" id="sendChips"></div>
    <div class="addRow">
      <input id="sendExtra" type="email" inputmode="email" autocomplete="off" placeholder="Add another email">
      <button class="gBtn" id="sendAdd">Add</button>
    </div>
    <div class="sendHint" id="sendHint"></div>
    <div class="sendLabel">Message</div>
    <textarea id="sendMsg" rows="3" maxlength="1500"></textarea>
    <div class="sendErr" id="sendErr"></div>
    <div class="sendActions">
      <button class="big retake" id="sendCancel">Cancel</button>
      <button class="big save" id="sendGo">✉️ Send</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lbStage">
    <button class="lbNav" id="lbPrev" aria-label="Previous photo">‹</button>
    <div class="lbImgWrap"><img id="lbImg" alt="Photo"><div class="lbLoading" id="lbLoading">Loading…</div></div>
    <button class="lbNav" id="lbNext" aria-label="Next photo">›</button>
  </div>
  <div class="lbInfo" id="lbInfo"></div>
  <div class="lbActions">
    <button class="big save" id="lbSend">✉️ Send</button>
    <a class="big retake" id="lbDownload" download>⬇ Download</a>
    <a class="big retake" id="lbDrive" target="_blank" rel="noopener">📁 Open in Drive</a>
    <button class="big retake" id="lbClose">✖ Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="blocker" id="blocker">
  <div>
    <h1 id="blockTitle"></h1>
    <p id="blockMsg"></p>
    <button class="big save" id="blockBtn">🔁 Try again</button>
  </div>
</div>

<script>
/* ======================= SETTINGS ======================= */
// Built-in connection: the plain page address works on any device, no setup link needed.
// If you redeploy to a NEW /exec URL or change KIOSK_KEY in the sheet, update these two lines and re-upload.
const DEFAULT_API   = 'https://script.google.com/macros/s/AKfycbwEGy3qGxkABwDdivmPO5wVnhDjS8_b1Ps7UF8Ial0-6UVIYhytmyan5aK1MYCOcK2K-w/exec';
const DEFAULT_KEY   = '01686b0c90';
const AUTO_SAVE_SEC = 10;          // review screen auto-saves after this many seconds
const MANUAL_MIN    = 30;          // a tapped class choice lasts this long before the schedule takes over again
const MIRROR_SAVED  = false;       // false = saved photo shows the real orientation (writing reads correctly)
const JPEG_QUALITY  = 0.88;

/* ======================= STATE ======================= */
const W = 1280, H = 720, T = 48;
const $ = id => document.getElementById(id);
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };

const qs = new URLSearchParams(location.search);
['api', 'key'].forEach(k => { const v = qs.get(k); if (v) ls('bb_' + k, v); });
// Order: link override (?api=&key=) → built-in values → whatever this browser saved earlier.
// Built-in values beat saved ones so devices set up with an old address fix themselves.
const API = qs.get('api') || DEFAULT_API || ls('bb_api') || '';
const KEY = qs.get('key') || DEFAULT_KEY || ls('bb_key') || '';
if (qs.has('api') || qs.has('key')) history.replaceState(null, '', location.pathname);

const FALLBACK_BORDERS = [
  { name: 'Tiger Stripes', type: 'builtin', style: 'tiger', banner: '' },
  { name: 'No Frame', type: 'builtin', style: 'none', banner: '' }
];

const state = { config: null, loading: false, manual: null, borderName: null, images: {}, busy: false, queue: [], autoTimer: null, shot: null };

/* ======================= STARTUP ======================= */
init();

async function init() {
  tickClock(); setInterval(tickClock, 1000);
  wireUi();
  if (!API || !KEY) {
    block('Almost ready! 🐯', 'Open this page once using the kiosk link from the Build Booth sheet (menu ▸ Show kiosk link). The Chromebook will remember it after that.', false);
    return;
  }
  try { await Promise.all([document.fonts.load('700 30px Fredoka'), document.fonts.load('600 24px Fredoka')]); } catch (e) {}
  await Promise.allSettled([startCamera(), loadConfig()]);
  setInterval(loadConfig, 10 * 60 * 1000);
  setInterval(renderWho, 15 * 1000);
  setInterval(flushQueue, 30 * 1000);
  keepAwake();
}

function wireUi() {
  $('snapBtn').onclick = snap;
  $('changeBtn').onclick = () => { unlockAudio(); pickClass(); };
  $('flipBtn').onclick = () => { unlockAudio(); flipCamera(); };
  wireGallery();
  $('saveBtn').onclick = () => saveShot();
  $('retakeBtn').onclick = retake;
  $('blockBtn').onclick = () => location.reload();

  // Logo: triple-tap refreshes schedule + borders
  let taps = 0, tapTimer = null;
  $('logo').onclick = () => {
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 700);
    if (taps >= 3) { taps = 0; loadConfig(true); }
  };

  // Keyboard / USB arcade button / presenter clicker
  document.addEventListener('keydown', e => {
    if ($('picker').classList.contains('show')) return;
    if (galleryKeys(e)) return; // gallery/lightbox handle their own keys
    const reviewing = $('review').classList.contains('show');
    if ([' ', 'Enter', 'PageDown', 'ArrowRight'].includes(e.key)) {
      e.preventDefault();
      if (reviewing) saveShot(); else snap();
    } else if (['Escape', 'PageUp', 'ArrowLeft', 'Backspace'].includes(e.key) && reviewing) {
      e.preventDefault(); retake();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { keepAwake(); renderWho(); }
  });
}

/* ======================= CAMERA ======================= */
let currentStream = null;

// facing: 'user' = selfie camera, 'environment' = back camera. Remembered per device.
async function startCamera(retrying) {
  const facing = ls('bb_facing') === 'environment' ? 'environment' : 'user';
  try {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    currentStream = stream;
    const v = $('video');
    v.srcObject = stream;
    const track = stream.getVideoTracks()[0];
    const actual = (track && track.getSettings && track.getSettings().facingMode) || facing;
    v.classList.toggle('mirror', actual !== 'environment'); // only mirror the selfie view
    await v.play().catch(() => {});
    updateFlipButton();
  } catch (err) {
    if (facing === 'environment' && !retrying) { ls('bb_facing', 'user'); return startCamera(true); }
    block('📷 Camera needed', 'Click the camera icon in the address bar, choose "Always allow", then press Try again. (' + (err.name || err) + ')', true);
    throw err;
  }
}

async function updateFlipButton() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    $('flipBtn').hidden = devices.filter(d => d.kind === 'videoinput').length < 2;
  } catch (e) { $('flipBtn').hidden = true; }
}

async function flipCamera() {
  if (state.busy) return;
  const next = ls('bb_facing') === 'environment' ? 'user' : 'environment';
  ls('bb_facing', next);
  $('flipBtn').disabled = true;
  try { await startCamera(); } catch (e) {}
  $('flipBtn').disabled = false;
  beep(700, 0.06);
}

/* ======================= CONFIG ======================= */
async function loadConfig(announce) {
  if (state.loading) return;
  state.loading = true;
  try {
    const r = await fetch(API + '?action=config&key=' + encodeURIComponent(KEY) + '&t=' + Date.now());
    const c = await r.json();
    if (!c.ok) throw new Error(c.error || 'Server said no.');
    if (!c.borders || !c.borders.length) c.borders = FALLBACK_BORDERS;
    await loadBorderImages(c.borders);
    const defaultChanged = !state.config || String(state.config.defaultBorder || '') !== String(c.defaultBorder || '');
    state.config = c;
    // Jump to the default frame on first load, when the sheet's DEFAULT_BORDER changes,
    // or when the selected frame was removed — unless a photo is in progress.
    if (!state.busy && (defaultChanged || !state.borderName || !c.borders.some(b => b.name === state.borderName))) {
      state.borderName = defaultBorderName();
    }
    renderBorders(); renderWho(); drawOverlay();
    if (announce) toast('🔄 Updated', c.blocks.length + ' Tiger Lab classes today', 2200);
  } catch (err) {
    console.warn('Config failed', err);
    if (!state.config) block('Can\'t reach the Build Booth server', String(err.message || err), true);
    else if (announce) toast('⚠️ No connection', 'Using the last schedule', 2500);
  } finally {
    state.loading = false;
  }
}

function loadBorderImages(borders) {
  return Promise.all(borders.filter(b => b.type === 'image' && b.data).map(b => new Promise(res => {
    const img = new Image();
    img.onload = () => { state.images[b.name] = img; res(); };
    img.onerror = () => res();
    img.src = b.data;
  })));
}

function defaultBorderName() {
  const c = state.config;
  if (!c) return null;
  const hit = c.borders.find(b => b.name.toLowerCase() === String(c.defaultBorder || '').toLowerCase());
  return (hit || c.borders[0]).name;
}

function currentBorder() {
  const list = (state.config && state.config.borders) || FALLBACK_BORDERS;
  return list.find(b => b.name === state.borderName) || list[0];
}

/* ======================= WHO'S HERE ======================= */
function scheduledClass() {
  const c = state.config;
  if (!c) return null;
  const d = new Date();
  const now = d.getHours() * 60 + d.getMinutes();
  const blocks = c.blocks || [];
  const strict = blocks.filter(b => b.start <= now && now < b.end).sort((a, b) => b.start - a.start);
  if (strict.length) return strict[0];
  let best = null, bestDist = 1e9;
  blocks.forEach(b => {
    let dist = null;
    if (now < b.start && b.start - now <= c.graceBefore) dist = b.start - now;
    else if (now >= b.end && now - b.end < c.graceAfter) dist = now - b.end + 0.5;
    if (dist !== null && dist < bestDist) { best = b; bestDist = dist; }
  });
  return best;
}

function currentClass() {
  if (state.manual && Date.now() - state.manual.at < MANUAL_MIN * 60000) return state.manual;
  state.manual = null;
  return scheduledClass();
}

function renderWho() {
  if (state.config && state.config.today !== localDate() && !state.loading) loadConfig();
  const cl = currentClass();
  const el = $('who');
  el.textContent = cl ? cl.teacher + (cl.grade ? ' · ' + cl.grade : '') : 'Tap Change to pick a class';
  el.classList.toggle('none', !cl);
}

function pickClass() {
  return new Promise(resolve => {
    const grid = $('pickGrid');
    grid.innerHTML = '';
    const list = (state.config && state.config.teachers) || [];
    list.forEach(t => grid.appendChild(teacherBtn(t.teacher, t.grade, '', () => done({ teacher: t.teacher, grade: t.grade || '' }))));
    const other = (state.config && state.config.otherFolder) || 'Unsorted';
    grid.appendChild(teacherBtn('🤔 Other / Not sure', '', 'other', () => done({ teacher: other, grade: '' })));
    $('pickClose').onclick = () => done(null);
    $('picker').classList.add('show');

    function done(v) {
      $('picker').classList.remove('show');
      if (v) { state.manual = Object.assign({ at: Date.now() }, v); renderWho(); }
      resolve(v);
    }
  });
}

function teacherBtn(name, grade, cls, onClick) {
  const b = document.createElement('button');
  b.className = 'tbtn ' + cls;
  b.innerHTML = esc(name) + (grade ? '<small>' + esc(grade) + '</small>' : '');
  b.onclick = onClick;
  return b;
}

/* ======================= SNAP FLOW ======================= */
async function snap() {
  if (state.busy) return;
  unlockAudio(); goFullscreen();
  const video = $('video');
  if (!video.videoWidth) { toast('📷 Camera warming up…', 'Try again in a second', 1800); return; }

  let cls = currentClass();
  if (!cls) { cls = await pickClass(); if (!cls) return; }

  state.busy = true; setControls(false);
  const count = $('count');
  count.classList.add('show');
  for (const n of [3, 2, 1]) {
    count.innerHTML = '<span>' + n + '</span>';
    beep(n === 1 ? 880 : 620, 0.18);
    await sleep(1000);
  }
  count.classList.remove('show'); count.innerHTML = '';

  const takenAt = new Date();
  shutter();
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');

  const border = currentBorder();
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  drawCover(ctx, video);
  drawBorder(ctx, border);
  drawStamp(ctx, cls, takenAt);

  state.shot = { dataUrl: canvas.toDataURL('image/jpeg', JPEG_QUALITY), cls, border: border.name, takenAt: takenAt.toISOString() };
  showReview();
}

function showReview() {
  $('reviewImg').src = state.shot.dataUrl;
  $('saveBtn').disabled = false; $('retakeBtn').disabled = false;
  $('review').classList.add('show');
  let left = AUTO_SAVE_SEC;
  const note = $('autoNote');
  note.textContent = 'Auto-saving in ' + left;
  clearInterval(state.autoTimer);
  state.autoTimer = setInterval(() => {
    left--;
    note.textContent = 'Auto-saving in ' + left;
    if (left <= 0) saveShot();
  }, 1000);
}

function retake() {
  if (!$('review').classList.contains('show')) return;
  clearInterval(state.autoTimer);
  $('review').classList.remove('show');
  state.shot = null; state.busy = false; setControls(true);
}

async function saveShot() {
  const shot = state.shot;
  if (!shot || $('saveBtn').disabled) return;
  clearInterval(state.autoTimer);
  $('saveBtn').disabled = true; $('retakeBtn').disabled = true;
  $('autoNote').textContent = 'Saving…';

  rememberRecent(shot); // "Just taken" tab on this device
  const ok = await upload(shot);
  $('review').classList.remove('show');
  state.shot = null;
  if (ok) {
    cheer();
    toast('🎉 Saved!', 'In ' + shot.cls.teacher + '\'s folder', 3200);
  } else {
    state.queue.push(shot); updatePending();
    toast('📦 Got it!', 'It will upload in a moment', 3200);
  }
  state.borderName = defaultBorderName() || state.borderName;
  renderBorders(); drawOverlay();
  await sleep(3200);
  state.busy = false; setControls(true);
}

async function upload(shot) {
  try {
    const r = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({
        key: KEY, teacher: shot.cls.teacher, grade: shot.cls.grade || '', border: shot.border,
        takenAt: shot.takenAt, image: shot.dataUrl, kiosk: /CrOS/.test(navigator.userAgent) ? 'Chromebook' : 'Browser'
      })
    });
    const j = await r.json();
    if (!j.ok) console.warn('Save refused:', j.error);
    return !!j.ok;
  } catch (err) {
    console.warn('Save failed', err);
    return false;
  }
}

async function flushQueue() {
  if (state.busy || !state.queue.length) return;
  while (state.queue.length) {
    if (!(await upload(state.queue[0]))) break;
    state.queue.shift();
  }
  updatePending();
}

function updatePending() {
  const n = state.queue.length;
  $('pending').hidden = !n;
  $('pending').textContent = '⏳ ' + n + ' waiting to upload';
}

/* ======================= BORDER PICKER ======================= */
function renderBorders() {
  const wrap = $('borders');
  wrap.innerHTML = '';
  const list = (state.config && state.config.borders) || FALLBACK_BORDERS;
  list.forEach(b => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (b.name === state.borderName ? ' on' : '');
    const cv = document.createElement('canvas');
    cv.width = 264; cv.height = 148;
    const ctx = cv.getContext('2d');
    ctx.scale(264 / W, 148 / H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#5D7BB8'); g.addColorStop(1, '#2C3E66');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    emoji(ctx, '🏗️', W / 2, H / 2 + 20, 300);
    drawBorder(ctx, b);
    const label = document.createElement('span');
    label.textContent = b.name;
    chip.append(cv, label);
    chip.onclick = () => {
      state.borderName = b.name;
      wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      chip.classList.add('on');
      drawOverlay(); beep(740, 0.06);
    };
    wrap.appendChild(chip);
  });
}

function drawOverlay() {
  const ctx = $('overlay').getContext('2d');
  ctx.clearRect(0, 0, W, H);
  drawBorder(ctx, currentBorder());
}

/* ======================= DRAWING ======================= */
function drawCover(ctx, video) {
  const vw = video.videoWidth, vh = video.videoHeight;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!vw) return;
  const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
  ctx.save();
  if (MIRROR_SAVED) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.restore();
}

function drawBorder(ctx, b) {
  if (!b) return;
  if (b.type === 'image') {
    const img = state.images[b.name];
    if (img) ctx.drawImage(img, 0, 0, W, H);
  } else if (b.style !== 'none') {
    const p = PAINTERS[b.style] || PAINTERS.classic;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.roundRect(T, T, W - 2 * T, H - 2 * T, 22); ctx.clip('evenodd');
    p.fill(ctx);
    ctx.restore();
    ctx.save();
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.roundRect(T, T, W - 2 * T, H - 2 * T, 22); ctx.stroke();
    ctx.restore();
    if (p.extras) p.extras(ctx);
  }
  if (b.banner) drawBanner(ctx, b.banner);
}

let seed = 1;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const PAINTERS = {
  classic: {
    fill(ctx) {
      ctx.fillStyle = '#F7931E'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 10;
      for (let x = -H; x < W; x += 34) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H, H); ctx.stroke(); }
      ctx.strokeStyle = '#0E1A33'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, W - 8, H - 8);
    },
    extras(ctx) { emoji(ctx, '🐯', T + 6, T + 6, 70); emoji(ctx, '🐾', W - T - 6, H - T - 6, 52); }
  },

  tiger: {
    fill(ctx) {
      seed = 7;
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#FFA230'); g.addColorStop(1, '#EE8410');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#1B1B1B';
      const stripe = (x, y, dx, dy, nx, ny) => {
        const len = T * (0.7 + rnd() * 0.35), wid = 22 + rnd() * 10, bend = (rnd() - 0.5) * 16;
        ctx.beginPath();
        ctx.moveTo(x - dx * wid / 2, y - dy * wid / 2);
        ctx.quadraticCurveTo(x + nx * len * 0.5 - dx * wid * 0.2 + dx * bend, y + ny * len * 0.5 - dy * wid * 0.2 + dy * bend,
                             x + nx * len + dx * bend, y + ny * len + dy * bend);
        ctx.quadraticCurveTo(x + nx * len * 0.5 + dx * wid * 0.3 + dx * bend, y + ny * len * 0.5 + dy * wid * 0.3 + dy * bend,
                             x + dx * wid / 2, y + dy * wid / 2);
        ctx.closePath(); ctx.fill();
      };
      for (let x = 30; x < W; x += 64 + rnd() * 20) { stripe(x, 0, 1, 0, 0, 1); stripe(x + 20, H, 1, 0, 0, -1); }
      for (let y = 40; y < H; y += 64 + rnd() * 20) { stripe(0, y, 0, 1, 1, 0); stripe(W, y + 20, 0, 1, -1, 0); }
    },
    extras(ctx) { emoji(ctx, '🐯', T + 6, T + 6, 74); emoji(ctx, '🐾', W - T - 6, T + 6, 54); }
  },

  blueprint: {
    fill(ctx) {
      ctx.fillStyle = '#1D4E89'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 16) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
      for (let y = 0; y <= H; y += 16) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 2;
      for (let x = T + 32; x < W - T; x += 32) {
        const long = (x - T) % 160 === 0;
        ctx.beginPath(); ctx.moveTo(x, T - (long ? 18 : 10)); ctx.lineTo(x, T - 3); ctx.stroke();
      }
    },
    extras(ctx) {
      gear(ctx, T + 4, T + 4, 46, 10, '#FFD166');
      gear(ctx, T - 4, T + 66, 24, 8, '#FFFFFF');
      gear(ctx, W - T - 4, H - T - 4, 46, 10, '#FFD166');
      gear(ctx, W - T + 4, H - T - 66, 24, 8, '#FFFFFF');
    }
  },

  space: {
    fill(ctx) {
      seed = 21;
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#0B1026'); g.addColorStop(1, '#2A1050');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 320; i++) {
        const x = rnd() * W, y = rnd() * H, r = 0.6 + rnd() * 1.8, a = 0.4 + rnd() * 0.6;
        if (Math.min(x, y, W - x, H - y) > T) continue;
        ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    },
    extras(ctx) { emoji(ctx, '🪐', W - T - 6, T + 6, 78); emoji(ctx, '🚀', T + 6, H - T - 6, 66); emoji(ctx, '⭐', T + 4, T + 4, 42); }
  },

  rainbow: {
    fill(ctx) {
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
      const cols = ['#E53935', '#FB8C00', '#FDD835', '#43A047', '#1E88E5', '#8E24AA'];
      const b = T / cols.length;
      cols.forEach((col, i) => {
        ctx.strokeStyle = col; ctx.lineWidth = b + 1;
        ctx.beginPath();
        ctx.roundRect(b * i + b / 2, b * i + b / 2, W - b * (2 * i + 1), H - b * (2 * i + 1), Math.max(4, 30 - i * 4));
        ctx.stroke();
      });
    },
    extras(ctx) { emoji(ctx, '🌈', T + 10, T + 4, 66); emoji(ctx, '☁️', W - T - 8, T + 4, 60); }
  },

  bricks: {
    fill(ctx) {
      seed = 5;
      const cols = ['#E53935', '#1E88E5', '#FDD835', '#43A047', '#FB8C00', '#F5F5F5'];
      ctx.fillStyle = '#263238'; ctx.fillRect(0, 0, W, H);
      const bw = 64, bh = 24;
      for (let y = 0, r = 0; y < H; y += bh, r++) {
        for (let x = (r % 2 ? -bw / 2 : 0); x < W; x += bw) {
          ctx.fillStyle = cols[Math.floor(rnd() * cols.length)];
          ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);
          ctx.fillStyle = 'rgba(255,255,255,.3)';
          [16, 48].forEach(sx => { ctx.beginPath(); ctx.arc(x + sx, y + bh / 2, 6, 0, Math.PI * 2); ctx.fill(); });
          ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(x + 1, y + bh - 5, bw - 2, 4);
        }
      }
    },
    extras(ctx) { emoji(ctx, '🧱', T + 4, T + 4, 58); emoji(ctx, '🔧', W - T - 4, H - T - 4, 52); }
  },

  confetti: {
    fill(ctx) {
      seed = 11;
      ctx.fillStyle = '#5B2BD6'; ctx.fillRect(0, 0, W, H);
      const cols = ['#FFD166', '#EF476F', '#06D6A0', '#4CC9F0', '#FFFFFF', '#F7931E'];
      for (let i = 0; i < 520; i++) {
        const x = rnd() * W, y = rnd() * H, rot = rnd() * Math.PI, col = cols[Math.floor(rnd() * cols.length)], dot = rnd() < 0.5;
        if (Math.min(x, y, W - x, H - y) > T + 4) continue;
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = col;
        if (dot) { ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill(); } else ctx.fillRect(-6, -2.5, 12, 5);
        ctx.restore();
      }
    },
    extras(ctx) { emoji(ctx, '🎉', T + 6, T + 6, 66); emoji(ctx, '🎊', W - T - 6, T + 6, 62); }
  },

  gold: {
    fill(ctx) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#FCE38A'); g.addColorStop(.35, '#E0A526'); g.addColorStop(.65, '#FFE89A'); g.addColorStop(1, '#B97D10');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let x = T + 60; x < W - T - 40; x += 80) { ctx.fillText('★', x, T / 2); ctx.fillText('★', x, H - T / 2); }
      for (let y = T + 60; y < H - T - 40; y += 80) { ctx.fillText('★', T / 2, y); ctx.fillText('★', W - T / 2, y); }
    },
    extras(ctx) { emoji(ctx, '🏆', T + 6, T + 6, 70); emoji(ctx, '🌟', W - T - 6, T + 6, 62); }
  }
};

function gear(ctx, cx, cy, r, teeth, color) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.beginPath();
  const step = Math.PI * 2 / teeth, ri = r * 0.78;
  const pt = (rr, a) => ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    pt(ri, a); pt(r, a + step * 0.18); pt(r, a + step * 0.48); pt(ri, a + step * 0.66);
  }
  ctx.closePath();
  ctx.moveTo(r * 0.32, 0); ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6;
  ctx.fill('evenodd');
  ctx.restore();
}

function emoji(ctx, ch, x, y, size) {
  ctx.save();
  ctx.font = size + 'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8;
  ctx.fillText(ch, x, y);
  ctx.restore();
}

function drawBanner(ctx, text) {
  ctx.save();
  ctx.font = '700 30px Fredoka, sans-serif';
  const w = ctx.measureText(text).width + 64, h = 56, x = (W - w) / 2, y = T - h / 2;
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#0E1A33';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = 4; ctx.strokeStyle = '#F7931E'; ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, y + h / 2 + 2);
  ctx.restore();
}

function drawStamp(ctx, cls, d) {
  const label = (state.config && state.config.label) || 'TIGER LAB';
  const left = '🐯 ' + label + '  ·  ' + cls.teacher + (cls.grade ? '  ·  ' + cls.grade : '');
  const right = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) +
                '  ·  ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  stampPill(ctx, left, 130, 'left');
  stampPill(ctx, right, W - 130, 'right');
}

function stampPill(ctx, text, anchor, align) {
  ctx.save();
  ctx.font = '600 24px Fredoka, sans-serif';
  const h = 46, w = ctx.measureText(text).width + 36;
  const x = align === 'left' ? anchor : anchor - w, y = H - T - h / 2;
  ctx.fillStyle = 'rgba(14,26,51,.9)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + 18, y + h / 2 + 1);
  ctx.restore();
}

/* ======================= SOUND ======================= */
let actx = null;
function unlockAudio() {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep(freq, dur, when) {
  if (!actx) return;
  const t = actx.currentTime + (when || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function shutter() {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * 0.12);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = buf; g.gain.value = 0.5;
  src.connect(g).connect(actx.destination); src.start();
}
function cheer() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.16, i * 0.11)); }

/* ======================= PHOTO GALLERY ======================= */
// "Just taken": photos snapped on THIS device today, kept in this browser only (no PIN).
// "Class photos": every saved photo, browsed by class from Drive, behind GALLERY_PIN.
const RECENT_KEY = 'bb_recent', RECENT_MAX = 16, GALLERY_IDLE_SEC = 120, PAGE_SIZE = 30;
const gal = { tab: 'recent', pin: null, view: 'pin', teacher: null, photos: [], total: 0, classes: [], items: [], index: 0, thumbs: {}, idle: null, token: 0,
  selecting: false, selected: [], contacts: null, mail: null, sendIds: [], extra: [] };

function wireGallery() {
  $('galleryBtn').onclick = () => { unlockAudio(); openGallery(); };
  $('gClose').onclick = closeGallery;
  $('gBack').onclick = () => { gal.view = 'classes'; renderGallery(); };
  document.querySelectorAll('.gTab').forEach(b => b.onclick = () => { gal.tab = b.dataset.tab; renderGallery(); });
  $('lbClose').onclick = closeLightbox;
  $('lbPrev').onclick = () => showLightbox(gal.index - 1);
  $('lbNext').onclick = () => showLightbox(gal.index + 1);
  ['pointerdown', 'keydown', 'scroll'].forEach(ev => $('gallery').addEventListener(ev, bumpIdle, true));
  $('lightbox').addEventListener('pointerdown', bumpIdle, true);
  ['pointerdown', 'keydown', 'input'].forEach(ev => $('sendDlg').addEventListener(ev, bumpIdle, true));
  // select + send
  $('gSelect').onclick = () => setSelecting(!gal.selecting);
  $('selClear').onclick = () => { gal.selected = []; syncSelection(); };
  $('selToday').onclick = selectToday;
  $('selSend').onclick = () => openSend(gal.selected.slice());
  $('lbSend').onclick = () => { const it = gal.items[gal.index]; if (it && it.id) openSend([it.id]); };
  $('sendCancel').onclick = closeSend;
  $('sendGo').onclick = doSend;
  $('sendAdd').onclick = addExtraEmail;
  $('sendExtra').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addExtraEmail(); } });
}

function galleryOpen() { return $('gallery').classList.contains('show'); }

function galleryKeys(e) {
  if ($('sendDlg').classList.contains('show')) {
    if (e.key === 'Escape') closeSend();
    return true; // let typing in the dialog work normally
  }
  if ($('lightbox').classList.contains('show')) {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') showLightbox(gal.index - 1);
    else if (e.key === 'ArrowRight') showLightbox(gal.index + 1);
    return true;
  }
  if (galleryOpen()) {
    if (e.key === 'Escape') closeGallery();
    else if (gal.tab === 'classes' && gal.view === 'pin' && /^[0-9]$/.test(e.key)) pinPress(e.key);
    else if (gal.tab === 'classes' && gal.view === 'pin' && e.key === 'Backspace') pinPress('⌫');
    else if (gal.tab === 'classes' && gal.view === 'pin' && e.key === 'Enter') pinPress('✓');
    return true;
  }
  return false;
}

function openGallery() {
  if (state.busy) return;
  gal.tab = 'recent';
  $('gallery').classList.add('show');
  $('gallery').setAttribute('aria-hidden', 'false');
  renderGallery(); bumpIdle();
}

function closeGallery() {
  closeSend();
  closeLightbox();
  gal.selecting = false; gal.selected = []; gal.contacts = null;
  $('gallery').classList.remove('show');
  $('gallery').setAttribute('aria-hidden', 'true');
  gal.pin = null; gal.view = 'pin'; gal.teacher = null; gal.classes = []; gal.photos = [];
  clearTimeout(gal.idle); gal.token++;
}

// Kiosk safety: an unattended gallery closes itself and locks Class photos again.
function bumpIdle() {
  clearTimeout(gal.idle);
  if (galleryOpen()) gal.idle = setTimeout(closeGallery, GALLERY_IDLE_SEC * 1000);
}

function renderGallery() {
  document.querySelectorAll('.gTab').forEach(b => b.classList.toggle('on', b.dataset.tab === gal.tab));
  const inClass = gal.tab === 'classes' && gal.view === 'class';
  $('gBack').hidden = !inClass;
  $('gTitle').textContent = inClass ? gal.teacher : 'Photos';
  $('gSelect').hidden = !inClass;
  $('lbSend').style.display = gal.tab === 'classes' ? '' : 'none';
  if (!inClass) { gal.selecting = false; gal.selected = []; }
  syncSelection();
  const body = $('gBody');
  body.scrollTop = 0;
  if (gal.tab === 'recent') return renderRecent(body);
  if (!gal.pin) { gal.view = 'pin'; return renderPin(body); }
  if (gal.view === 'class') return renderClassPhotos(body, true);
  return renderClassList(body);
}

/* ---- Just taken (this device) ---- */
function readRecent() {
  try {
    const list = JSON.parse(ls(RECENT_KEY) || '[]');
    const today = localDate();
    return Array.isArray(list) ? list.filter(x => x && x.day === today && x.src) : [];
  } catch (e) { return []; }
}

function rememberRecent(shot) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 640; c.height = 360;
    c.getContext('2d').drawImage(img, 0, 0, 640, 360);
    let list = readRecent();
    list.unshift({ day: localDate(), taken: shot.takenAt, teacher: shot.cls.teacher, grade: shot.cls.grade || '', border: shot.border, src: c.toDataURL('image/jpeg', 0.72) });
    list = list.slice(0, RECENT_MAX);
    while (list.length) { // shrink until it fits in browser storage
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); break; } catch (e) { list.pop(); }
    }
  };
  img.src = shot.dataUrl;
}

function renderRecent(body) {
  const list = readRecent();
  if (!list.length) {
    body.innerHTML = '<div class="gEmpty"><div><b>📸</b>No photos on this screen yet today.<br>Snap your creation to see it here!</div></div>';
    return;
  }
  body.innerHTML = '<p class="gNote">Photos taken on this screen today. They\'re also saved to each class\'s folder.</p>';
  const grid = document.createElement('div'); grid.className = 'gGrid gBigGrid';
  gal.items = list.map(x => ({ src: x.src, taken: x.taken, teacher: x.teacher, grade: x.grade, border: x.border, local: true }));
  gal.items.forEach((it, i) => {
    const b = document.createElement('button'); b.className = 'gThumb';
    b.innerHTML = '<img alt=""><span class="cap"></span>';
    b.querySelector('img').src = it.src;
    b.querySelector('.cap').textContent = it.teacher + ' · ' + fmtTime(it.taken);
    b.onclick = () => showLightbox(i);
    grid.appendChild(b);
  });
  body.appendChild(grid);
}

/* ---- PIN ---- */
let pinEntry = '';
function renderPin(body) {
  pinEntry = '';
  body.innerHTML =
    '<div class="pinBox"><h3>🔒 Class photos</h3><p>Teachers: enter the PIN to look back at every class\'s photos.</p>' +
    '<div class="pinDots" id="pinDots"></div><div class="pinPad" id="pinPad"></div><div class="pinMsg" id="pinMsg"></div></div>';
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓'].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k; if (k === '✓') b.className = 'ok';
    b.setAttribute('aria-label', k === '⌫' ? 'Delete' : k === '✓' ? 'Enter' : k);
    b.onclick = () => pinPress(k);
    $('pinPad').appendChild(b);
  });
  drawPinDots();
}
function drawPinDots() {
  const n = Math.max(4, pinEntry.length);
  $('pinDots').innerHTML = Array.from({ length: n }, (_, i) => '<i class="' + (i < pinEntry.length ? 'f' : '') + '"></i>').join('');
}
async function pinPress(k) {
  if (!$('pinDots')) return;
  if (k === '⌫') pinEntry = pinEntry.slice(0, -1);
  else if (k === '✓') return submitPin();
  else if (pinEntry.length < 8) pinEntry += k;
  $('pinMsg').textContent = '';
  drawPinDots();
}
async function submitPin() {
  if (!pinEntry) return;
  $('pinMsg').textContent = 'Checking…';
  const res = await api({ action: 'gallery_classes', pin: pinEntry });
  if (res && res.ok) {
    gal.pin = pinEntry; gal.classes = res.classes || []; gal.view = 'classes';
    beep(880, 0.08); renderGallery();
  } else {
    const dots = $('pinDots'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    $('pinMsg').textContent = res && res.error === 'pin' ? 'Wrong PIN — try again.' : 'Can\'t reach the server right now.';
    pinEntry = ''; drawPinDots(); beep(220, 0.2);
  }
}

/* ---- Class list ---- */
async function renderClassList(body) {
  const token = ++gal.token;
  if (!gal.classes.length) {
    body.innerHTML = '<div class="gEmpty"><div>Loading classes…</div></div>';
    const res = await api({ action: 'gallery_classes', pin: gal.pin });
    if (token !== gal.token) return;
    gal.classes = (res && res.ok && res.classes) || [];
  }
  if (!gal.classes.length) {
    body.innerHTML = '<div class="gEmpty"><div><b>🗂️</b>No class photos yet.<br>They\'ll show up here after the first save.</div></div>';
    return;
  }
  body.innerHTML = '<p class="gNote">Pick a class to see every photo it has taken, newest first.</p>';
  const grid = document.createElement('div'); grid.className = 'gClassGrid';
  gal.classes.forEach(c => {
    const b = document.createElement('button'); b.className = 'gClass';
    b.innerHTML = '<div class="cover">🐯</div><div class="meta"><b></b><span></span></div>';
    b.querySelector('b').textContent = c.teacher;
    b.querySelector('span').textContent = (c.grade ? c.grade + ' · ' : '') + c.count + ' photo' + (c.count === 1 ? '' : 's') + ' · last ' + fmtDay(c.last);
    b.onclick = () => { gal.teacher = c.teacher; gal.view = 'class'; gal.photos = []; gal.total = 0; renderGallery(); };

  });

/* ---- One class's photos ---- */
async function renderClassPhotos(body, fresh) {
  const token = fresh ? ++gal.token : gal.token;
  if (fresh) body.innerHTML = '<div class="gEmpty"><div>Loading photos…</div></div>';
  const res = await api({ action: 'gallery_photos', pin: gal.pin, teacher: gal.teacher, offset: gal.photos.length, limit: PAGE_SIZE });
  if (token !== gal.token) return;
  if (!res || !res.ok) {
    if (res && res.error === 'pin') { gal.pin = null; return renderGallery(); }
    body.innerHTML = '<div class="gEmpty"><div><b>⚠️</b>Couldn\'t load photos. Check the connection and try again.</div></div>';
    return;
  }
  gal.total = res.total;
  gal.photos = gal.photos.concat(res.photos || []);
  gal.items = gal.photos.map(p => ({ id: p.id, taken: p.taken, teacher: gal.teacher, grade: p.grade, border: p.border }));
  if (!gal.items.length) { body.innerHTML = '<div class="gEmpty"><div><b>📷</b>No photos for this class yet.</div></div>'; return; }

  body.innerHTML = '';
  body.insertAdjacentHTML('beforeend', '<p class="gNote">' + gal.total + ' photo' + (gal.total === 1 ? '' : 's') + ' · newest first</p>');
  let lastDay = '', grid = null;
  gal.items.forEach((it, i) => {
    const day = fmtDay(it.taken, true);
    if (day !== lastDay) {
      lastDay = day;
      body.insertAdjacentHTML('beforeend', '<div class="gDate"></div>');
      body.lastElementChild.textContent = day;
      grid = document.createElement('div'); grid.className = 'gGrid'; body.appendChild(grid);
    }
    const b = document.createElement('button'); b.className = 'gThumb';
    b.innerHTML = '<span class="spin">Loading…</span><span class="cap"></span><span class="check">✓</span>';
    b.dataset.id = it.id;
    b.querySelector('.cap').textContent = fmtTime(it.taken) + (it.border ? ' · ' + it.border : '');
    b.onclick = () => gal.selecting ? toggleSelect(it.id) : showLightbox(i);
    grid.appendChild(b);
    loadThumb(it.id, token).then(src => {
      if (src) b.insertAdjacentHTML('afterbegin', '<img alt="" src="' + src + '">'), b.querySelector('.spin').remove();
      else { b.classList.add('err'); b.querySelector('.spin').textContent = '🚫'; }
    });
  });
  if (gal.photos.length < gal.total) {
    const more = document.createElement('button');
    more.className = 'big retake gMore'; more.textContent = 'Show more photos';
    more.onclick = () => { more.disabled = true; more.textContent = 'Loading…'; renderClassPhotos(body, false); };
    body.appendChild(more);
  }
  syncSelection();
}

/* ---- Select photos to send ---- */
function setSelecting(on) {
  gal.selecting = on;
  if (!on) gal.selected = [];
  syncSelection();
}
function toggleSelect(id) {
  const i = gal.selected.indexOf(id);
  if (i > -1) gal.selected.splice(i, 1);
  else {
    const max = (gal.mail && gal.mail.maxPhotos) || 20;
    if (gal.selected.length >= max) { toast('📎 That\'s the limit', 'Up to ' + max + ' photos per email', 2200); return; }
    gal.selected.push(id);
  }
  syncSelection();
}
function selectToday() {
  const today = new Date().toDateString();
  const max = (gal.mail && gal.mail.maxPhotos) || 20;
  const ids = gal.items.filter(it => it.id && new Date(it.taken).toDateString() === today).map(it => it.id);
  if (!ids.length) { toast('📅 No photos today', 'This class has no photos from today', 2200); return; }
  gal.selected = ids.slice(0, max);
  if (ids.length > max) toast('📎 Picked the newest ' + max, 'That\'s the most for one email', 2400);
  syncSelection();
}
function syncSelection() {
  const inClass = gal.tab === 'classes' && gal.view === 'class';
  $('gBody').classList.toggle('selecting', inClass && gal.selecting);
  $('gSelect').classList.toggle('on', gal.selecting);
  $('gSelect').textContent = gal.selecting ? '✖ Done selecting' : '☑️ Select to send';
  $('selBar').hidden = !(inClass && gal.selecting);
  const n = gal.selected.length;
  $('selCount').textContent = n ? n + ' photo' + (n === 1 ? '' : 's') + ' selected' : 'Tap photos to pick them';
  $('selSend').disabled = !n;
  document.querySelectorAll('#gBody .gThumb[data-id]').forEach(b => b.classList.toggle('sel', gal.selected.indexOf(b.dataset.id) > -1));

/* ---- Send dialog ---- */

function renderChips(keepOn) {
  const wrap = $('sendChips'); wrap.innerHTML = '';
  const isOn = (email, dflt) => keepOn ? keepOn.indexOf(email) > -1 : dflt;
  const cls = String(gal.teacher || '').toLowerCase();
  // Class teacher first, then principals/admin, then everyone else.
  const rank = c => (c.teacher && c.teacher.toLowerCase() === cls) ? 0 : /principal|admin|office/i.test(c.role) ? 1 : 2;
  const list = gal.contacts.slice().sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  if (!list.length && !gal.extra.length) {
    wrap.innerHTML = '<span class="sendHint">No contacts yet — add emails on the sheet\'s Contacts tab, or type one below.</span>';
  }
  list.forEach(c => {
    const b = document.createElement('button'); b.className = 'chip2'; b.dataset.email = c.email;
    b.textContent = c.name;
    if (c.role) { const sm = document.createElement('small'); sm.textContent = c.role; b.appendChild(sm); }
    if (isOn(c.email, rank(c) === 0)) b.classList.add('on'); // default: pre-select this class's teacher
    b.onclick = () => b.classList.toggle('on');
    wrap.appendChild(b);
  });
  gal.extra.forEach(em => {
    const b = document.createElement('button'); b.className = 'chip2' + (isOn(em, true) ? ' on' : ''); b.dataset.email = em; b.textContent = em;
    b.onclick = () => b.classList.toggle('on');
    wrap.appendChild(b);
  });
}

function addExtraEmail() {
  const em = $('sendExtra').value.trim().toLowerCase();
  if (!em) return;
  const dom = gal.mail && gal.mail.domain;
  const valid = /^[^\s@<>(),;:"]+@[^\s@<>(),;:"]+\.[a-z]{2,}$/i.test(em);
  const known = (gal.contacts || []).some(c => c.email === em);
  if (!valid || (!known && dom && !em.endsWith('@' + dom))) {
    $('sendErr').textContent = dom ? 'Use a @' + dom + ' address (or add them to the Contacts tab).' : 'That doesn\'t look like an email address.';
    return;
  }
  const chip = document.querySelector('#sendChips .chip2[data-email="' + CSS.escape(em) + '"]');
  if (chip) chip.classList.add('on');
  else {
    const on = Array.from(document.querySelectorAll('#sendChips .chip2.on')).map(c => c.dataset.email);
    gal.extra.push(em); on.push(em);
    renderChips(on); // keep everyone already tapped
  }
  $('sendExtra').value = ''; $('sendErr').textContent = '';
}

async function doSend() {
  if ($('sendExtra').value.trim()) addExtraEmail();
  const to = Array.from(document.querySelectorAll('#sendChips .chip2.on')).map(c => c.dataset.email);
  if (!to.length) { $('sendErr').textContent = 'Tap at least one person to send to.'; return; }
  const btn = $('sendGo');
  btn.disabled = true; btn.textContent = 'Sending…'; $('sendErr').textContent = '';
  let res = null;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ key: KEY, action: 'send', pin: gal.pin, ids: gal.sendIds, to, message: $('sendMsg').value }) });
    res = await r.json();
  } catch (e) { res = null; }
  btn.disabled = false; btn.textContent = '✉️ Send';
  if (res && res.ok) {
    closeSend(); closeLightbox(); setSelecting(false);
    cheer();
    const names = res.to || [];
    toast('📨 Sent!', res.sent + ' photo' + (res.sent === 1 ? '' : 's') + ' to ' + (names.length > 2 ? names.slice(0, 2).join(', ') + ' +' + (names.length - 2) : names.join(' & ')), 3500);
  } else {
    $('sendErr').textContent = res ? (res.error === 'pin' ? 'PIN expired — close and unlock again.' : res.error || res.message) : 'Couldn\'t send — check the connection and try again.';
  }
}

function closeSend() {
  const dlg = $('sendDlg');
  dlg.classList.remove('show'); dlg.setAttribute('aria-hidden', 'true');
}

// Thumbnails load a few at a time so the server isn't flooded.
const thumbQueue = []; let thumbActive = 0;
function loadThumb(id, token) {
  if (gal.thumbs[id]) return Promise.resolve(gal.thumbs[id]);
  return new Promise(resolve => { thumbQueue.push({ id, token, resolve }); pumpThumbs(); });
}
function pumpThumbs() {
  while (thumbActive < 4 && thumbQueue.length) {
    const job = thumbQueue.shift();
    if (job.token !== gal.token) { job.resolve(null); continue; }
    thumbActive++;
    api({ action: 'gallery_thumb', pin: gal.pin, id: job.id }).then(res => {
      if (res && res.ok && res.data) gal.thumbs[job.id] = res.data;
      job.resolve(gal.thumbs[job.id] || null);
    }).finally(() => { thumbActive--; pumpThumbs(); });
  }
}

/* ---- Lightbox ---- */
async function showLightbox(i) {
  if (i < 0 || i >= gal.items.length) return;
  gal.index = i;
  const it = gal.items[i];
  const lb = $('lightbox');
  lb.classList.add('show'); lb.setAttribute('aria-hidden', 'false');
  $('lbPrev').disabled = i === 0;
  $('lbNext').disabled = i === gal.items.length - 1;
  $('lbInfo').textContent = it.teacher + (it.grade ? ' · ' + it.grade : '') + ' · ' + fmtDay(it.taken, true) + ' ' + fmtTime(it.taken) + (it.border ? ' · ' + it.border : '');
  const dl = $('lbDownload'), drive = $('lbDrive');
  drive.style.display = it.id ? '' : 'none';
  if (it.id) drive.href = 'https://drive.google.com/file/d/' + it.id + '/view';
  const fileName = 'Tiger Lab - ' + it.teacher + ' - ' + String(it.taken).slice(0, 10) + '.jpg';
  dl.download = fileName;

  if (it.local) { setLightboxImage(it.src); dl.href = it.src; return; }
  // Show the thumbnail right away, then swap in the full photo.
  setLightboxImage(gal.thumbs[it.id] || '', !it.full);
  dl.removeAttribute('href');
  if (!it.full) {
    const res = await api({ action: 'gallery_photo', pin: gal.pin, id: it.id });
    if (res && res.ok && res.data) it.full = res.data;
  }
  if (gal.index !== i) return; // moved on while loading
  if (it.full) { setLightboxImage(it.full); dl.href = it.full; }
  else { $('lbLoading').textContent = 'Couldn\'t load this photo.'; $('lbLoading').classList.add('show'); }
}
function setLightboxImage(src, loading) {
  const img = $('lbImg');
  if (src) img.src = src; else img.removeAttribute('src');
  img.style.visibility = src ? 'visible' : 'hidden';
  $('lbLoading').textContent = 'Loading…';
  $('lbLoading').classList.toggle('show', !!loading);
}
function closeLightbox() {
  const lb = $('lightbox');
  lb.classList.remove('show'); lb.setAttribute('aria-hidden', 'true');
}

/* ---- helpers ---- */
async function api(params) {
  try {
    const q = new URLSearchParams(Object.assign({ key: KEY, t: Date.now() }, params));
    const r = await fetch(API + '?' + q.toString());
    return await r.json();
  } catch (e) { return null; }
}
function fmtTime(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function fmtDay(iso, long) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const today = new Date(); const y = new Date(); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US', long ? { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' });
}

/* ======================= UTIL ======================= */
function setControls(on) { $('controls').classList.toggle('locked', !on); $('changeBtn').disabled = !on; $('flipBtn').disabled = !on; $('galleryBtn').disabled = !on; }
function toast(big, small, ms) {
  const t = $('toast');
  t.innerHTML = esc(big) + (small ? '<small>' + esc(small) + '</small>' : '');
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms || 2500);
}
function block(title, msg, retry) {
  $('blockTitle').textContent = title; $('blockMsg').textContent = msg;
  $('blockBtn').style.display = retry ? '' : 'none';
  $('blocker').classList.add('show');
}
function tickClock() { $('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function localDate() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function goFullscreen() { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); }
async function keepAwake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
</script>
